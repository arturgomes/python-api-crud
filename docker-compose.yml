version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: python_crud_db
    environment:
      POSTGRES_USER: pythonuser
      POSTGRES_PASSWORD: pythonpass
      POSTGRES_DB: pythoncrud
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with Rust project
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythonuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
